version: '3'

tasks:
  # ---- Development ----
  dev:
    desc: Start all services for local development
    deps: [dev:db, dev:api]

  dev:api:
    desc: Start Go API with live reload
    dir: apps/api
    dotenv: ['../../.env']
    cmds:
      - air

  dev:db:
    desc: Start Postgres via Docker Compose
    cmds:
      - docker compose up postgres -d

  # ---- Code Generation ----
  generate:
    desc: Generate OpenAPI spec and sqlc code
    cmds:
      - task: generate:openapi
      - task: generate:sqlc

  generate:openapi:
    desc: Generate OpenAPI YAML from Go code
    dir: apps/api
    cmds:
      - go run ./cmd/openapi-gen 2>/dev/null > ./api/openapi.yaml

  generate:sqlc:
    desc: Generate Go DB code from SQL queries
    dir: apps/api
    cmds:
      - sqlc generate

  tools:export:
    desc: Print AI tool manifests (openapi.json, openai, anthropic)
    cmds:
      - 'echo "--- /openapi.json ---" && curl -s http://localhost:8080/openapi.json | jq ".info.title, (.paths | keys | length)"'
      - 'echo "--- /tools/openai.json ---" && curl -s http://localhost:8080/tools/openai.json | jq ".tools | length"'
      - 'echo "--- /tools/anthropic.json ---" && curl -s http://localhost:8080/tools/anthropic.json | jq ".tools | length"'

  # ---- Database ----
  migrate:
    desc: Run database migrations
    dir: apps/api
    dotenv: ['../../.env']
    cmds:
      - goose -dir db/migrations postgres "$DATABASE_URL" up

  migrate:down:
    desc: Roll back last migration
    dir: apps/api
    dotenv: ['../../.env']
    cmds:
      - goose -dir db/migrations postgres "$DATABASE_URL" down

  migrate:create:
    desc: Create a new migration file
    dir: apps/api
    cmds:
      - goose -dir db/migrations create {{.CLI_ARGS}} sql

  migrate:status:
    desc: Show migration status
    dir: apps/api
    dotenv: ['../../.env']
    cmds:
      - goose -dir db/migrations postgres "$DATABASE_URL" status

  # ---- Quality ----
  lint:
    desc: Lint Go code
    cmds:
      - cd apps/api && golangci-lint run ./...

  test:
    desc: Run Go tests
    cmds:
      - cd apps/api && go test -p 1 ./...

  format:
    desc: Format all code
    cmds:
      - cd apps/api && gofmt -w .
      - cd apps/api && goimports -w .

  check:
    desc: Run all checks (lint + test)
    cmds:
      - task: lint
      - task: test

  # ---- Build ----
  build:
    desc: Build Go API server and CLI
    cmds:
      - cd apps/api && go build -o ./tmp/server ./cmd/server
      - cd apps/api && go build -o ./tmp/kanjo ./cmd/kanjo

  # ---- Scraper ----
  scraper:fetch:
    desc: Run scraper fetch-daily job
    dir: jobs/scraper
    cmds:
      - pnpm run fetch-daily
    env:
      DATABASE_URL: 'postgresql://dev:dev@localhost:5432/kanjo'

  scraper:initial:
    desc: Run scraper initial backfill
    dir: jobs/scraper
    cmds:
      - pnpm run initial-run
    env:
      DATABASE_URL: 'postgresql://dev:dev@localhost:5432/kanjo'

  scraper:refresh:
    desc: Trigger MF account refresh
    dir: jobs/scraper
    cmds:
      - pnpm run refresh
    env:
      DATABASE_URL: 'postgresql://dev:dev@localhost:5432/kanjo'

  scraper:login:
    desc: Interactive login for initial 2FA setup
    dir: jobs/scraper
    cmds:
      - pnpm run login-only
    env:
      DATABASE_URL: 'postgresql://dev:dev@localhost:5432/kanjo'

  # ---- Transform ----
  transform:run:
    desc: Run transform pipeline once
    dir: jobs/transform
    cmds:
      - uv run transform run
    env:
      DATABASE_URL: 'postgresql://dev:dev@localhost:5432/kanjo'

  transform:backfill:
    desc: Backfill all historical transactions
    dir: jobs/transform
    cmds:
      - uv run transform backfill
    env:
      DATABASE_URL: 'postgresql://dev:dev@localhost:5432/kanjo'

  transform:listen:
    desc: Listen for scraper events and transform
    dir: jobs/transform
    cmds:
      - uv run transform listen
    env:
      DATABASE_URL: 'postgresql://dev:dev@localhost:5432/kanjo'

  # ---- Ship ----
  ship:
    desc: Format, check, create PR, and merge to main
    cmds:
      - bash scripts/ship.sh

  # ---- Cleanup ----
  clean:
    desc: Clean all build artifacts
    cmds:
      - rm -rf apps/api/tmp
